apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote
  namespace: kargo-helm
spec:
  vars:
  - name: image
    value: ghcr.io/linaewen19/guestbook
  - name: repoURL
    value: https://github.com/linaewen19/kargo-helm.git
  - name: branch
    value: main

  steps:
  - uses: git-clone
    config:
      repoURL: ${{ vars.repoURL }}
      checkout:
      - branch: ${{ vars.branch }}
        path: ./out
  - if: ${{ ctx.targetFreight.origin.name == "guestbook" }}
    uses: yaml-update
    as: update-image
    config:
      path: ./out/env/${{ ctx.stage }}/values.yaml
      updates:
      - key: image.tag
        value: ${{ imageFrom( vars.image ).Tag }}
  - if: ${{ ctx.targetFreight.origin.name == "features" }}
    uses: git-clone
    config:
      repoURL: ${{ vars.repoURL }}
      checkout:
      - commit: ${{ commitFrom( vars.repoURL ).ID }}
        path: ./features
  - if: ${{ ctx.targetFreight.origin.name == "features" }}
    uses: copy
    config:
      inPath: ./features/base/feature-flags.yaml
      outPath: ./out/env/${{ ctx.stage }}/feature-flags.yaml
  - uses: git-commit
    as: commit
    config:
      path: ./out
      message: "${{
        ctx.targetFreight.origin.name == 'guestbook' ? 
        'updated '+ctx.stage+' guestbook to '+imageFrom( vars.image ).Tag :
        'updates '+ctx.stage+' features.yaml from '+commitFrom( vars.repoURL ).ID
        }}"
  - uses: git-push
    as: push
    config:
      path: ./out
      generateTargetBranch: true
  - uses: git-open-pr
    as: open-pr
    config:
      repoURL: ${{ vars.repoURL }}
      sourceBranch: ${{ task.outputs.push.branch }}
      targetBranch: ${{ vars.branch }}
      provider: github
      title: "Promote ${{ ctx.stage }}"
  - uses: git-wait-for-pr
    as: wait
    config:
      provider: github
      prNumber: ${{ task.outputs['open-pr'].pr.id }}
  - uses: argocd-update
    config:
      apps:
      - name: kargo-helm-${{ ctx.stage }}
