apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: features
  namespace: kargo-helm
spec:
  subscriptions:
  - git:
      branch: main
      commitSelectionStrategy: NewestFromBranch
      discoveryLimit: 20
      repoURL: https://github.com/linaewen19/kargo-helm.git
      includePaths:
      - base/feature-flags.yaml

---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: guestbook-preprod-safti-fr
  namespace: kargo-helm
spec:
  subscriptions:
  - image:
      repoURL: ghcr.io/linaewen19/guestbook
      imageSelectionStrategy: NewestBuild
      allowTagsRegexes:
      - ^preprod-safti-fr-

